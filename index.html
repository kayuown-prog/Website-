
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeDroid Cloud</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial}
header{padding:20px;background:#101a2c;display:flex;justify-content:space-between}
.logo{font-size:22px;color:#55d6ff;font-weight:bold}
main{max-width:900px;margin:30px auto;padding:15px}
h1{text-align:center}
.sub{text-align:center;color:#9aabc5}
.card{background:#111c30;border:1px solid #263b59;border-radius:18px;padding:22px;margin-top:25px}
.phone{width:230px;height:410px;margin:20px auto;background:#182c50;border:7px solid #65748b;border-radius:30px;text-align:center;padding:20px}
.clock{font-size:35px;margin-top:50px}
.robot{font-size:55px;margin:35px}
button{padding:13px 20px;border:0;border-radius:9px;margin:5px;cursor:pointer;font-weight:bold}
.start{background:#28d995}
.stop{background:#ff6575;color:white}
.center{text-align:center}
.note{text-align:center;color:#9aabc5;font-size:13px}
a{color:#55d6ff}
</style>
</head>
<body>
<header>
<div class="logo">FreeDroid Cloud ☁️</div>
<div>Android 7.0</div>
</header>
<main>
<h1>My Cloud Phone</h1>
<p class="sub">Your Android phone in the cloud.</p>
<div class="card">
<h2 class="center">Virtual Android Phone</h2>
<p class="center" id="status">● Offline</p>
<div class="phone">
<div>Android Nougat</div>
<div class="clock">10:08</div>
<div class="robot">🤖</div>
<h3>Android 7.0</h3>
<p>Phone Preview</p>
</div>
<div class="center">
<button class="start" onclick="startPhone()">Start Phone</button>
<button class="stop" onclick="stopPhone()">Stop Phone</button>
</div>
<p class="note" id="message">Cloud emulator is not connected yet.</p>
<div class="center">
<a href="login.html">Login</a> |
<a href="signup.html">Signup</a>
</div>
</div>
</main>
<script>
function startPhone(){
document.getElementById("status").innerText="● Demo Preview";
document.getElementById("message").innerText="Real Android Cloud Server is not connected yet.";
}
function stopPhone(){
document.getElementById("status").innerText="● Offline";
}
</script>
</body>
</html>
