
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Master - Admin Login</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{
 margin:0;min-height:100vh;background:#10141c;color:white;
 display:flex;align-items:center;justify-content:center;padding:20px
}
.login-box{
 width:100%;max-width:400px;background:#1b2433;
 padding:30px;border-radius:16px;text-align:center;
 border:1px solid #d6a84b;box-shadow:0 10px 35px #0008
}
h1{color:#f5c76a;margin-bottom:10px}
h3{margin:20px 0;color:#ddd}
input{
 width:100%;padding:14px;margin:12px 0;
 border:1px solid #555;border-radius:8px;
 background:#10141c;color:white;font-size:16px
}
button{
 width:100%;padding:14px;margin-top:12px;
 background:#d6a84b;border:0;border-radius:8px;
 font-weight:bold;font-size:15px;cursor:pointer
}
button:hover{background:#f5c76a}
button:disabled{opacity:.5;cursor:not-allowed}
#message{margin-top:18px;color:#f5c76a;overflow-wrap:anywhere}
.small{color:#aaa;font-size:12px;margin-top:15px}
</style>
</head>
<body>

<div class="login-box">
 <h1>♟ CHESS MASTER</h1>
 <p>Private Administration</p>
 <h3>Admin Login</h3>

 <button id="googleBtn">Continue with Google</button>

 <div id="passwordArea" style="display:none">
  <input id="password" type="password"
   placeholder="Enter Secret Password"
   autocomplete="current-password">
  <button id="loginBtn">Unlock Admin Panel</button>
 </div>

 <p id="message">Login with your Owner Google Account.</p>
 <p class="small">Authorized Admin Only</p>
</div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,GoogleAuthProvider,signInWithPopup,
 signOut,setPersistence,browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getDatabase,ref,get
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyAtpvwOOn-7I6eoRR3VK2ZR_IqIy7Hcu0Y",
 authDomain:"freedroid-cloud.firebaseapp.com",
 databaseURL:"https://freedroid-cloud-default-rtdb.firebaseio.com",
 projectId:"freedroid-cloud",
 storageBucket:"freedroid-cloud.firebasestorage.app",
 messagingSenderId:"909415918359",
 appId:"1:909415918359:web:85da71cdd35a879fa86552",
 measurementId:"G-HV2ELB7GS6"
};

const OWNER_UID="rDUXxSYOPchI8eKuIPlyLy0dJdU2";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const provider=new GoogleAuthProvider();

provider.setCustomParameters({prompt:"select_account"});

const $=id=>document.getElementById(id);

let ownerUser=null;

function fromBase64(value){
 return Uint8Array.from(atob(value),c=>c.charCodeAt(0));
}

async function makeHash(password,salt,iterations){
 const key=await crypto.subtle.importKey(
  "raw",new TextEncoder().encode(password),
  "PBKDF2",false,["deriveBits"]
 );

 const bits=await crypto.subtle.deriveBits({
  name:"PBKDF2",salt,iterations,hash:"SHA-256"
 },key,256);

 return new Uint8Array(bits);
}

function compareHash(a,b){
 if(a.length!==b.length)return false;
 let result=0;
 for(let i=0;i<a.length;i++)result|=a[i]^b[i];
 return result===0;
}

// GOOGLE OWNER LOGIN

$("googleBtn").addEventListener("click",async()=>{
 try{
  $("googleBtn").disabled=true;
  $("message").textContent="Checking Google Account...";

  await setPersistence(auth,browserLocalPersistence);

  const result=await signInWithPopup(auth,provider);

  if(result.user.uid!==OWNER_UID){
   ownerUser=null;
   $("passwordArea").style.display="none";
   $("message").textContent="Access Denied: Unauthorized Google Account.";
   await signOut(auth);
   $("googleBtn").disabled=false;
   return;
  }

  ownerUser=result.user;
  $("googleBtn").style.display="none";
  $("passwordArea").style.display="block";
  $("message").textContent="Owner verified. Enter Secret Password.";

 }catch(error){
  $("message").textContent="Google Login Error: "+error.message;
  $("googleBtn").disabled=false;
 }
});

// SECRET PASSWORD LOGIN

$("loginBtn").addEventListener("click",async()=>{
 if(!ownerUser||auth.currentUser?.uid!==OWNER_UID){
  $("message").textContent="Owner verification required.";
  return;
 }

 const password=$("password").value;
 if(!password){
  $("message").textContent="Enter your Secret Password.";
  return;
 }

 try{
  $("loginBtn").disabled=true;
  $("message").textContent="Verifying Secret Password...";

  const snapshot=await get(ref(db,"adminData/password"));

  if(!snapshot.exists())
   throw new Error("Admin password setup not found.");

  const data=snapshot.val();

  if(
   data.algorithm!=="PBKDF2-SHA256"||
   !Number.isInteger(data.iterations)||
   data.iterations!==310000||
   !data.salt||!data.hash
  ){
   throw new Error("Invalid password configuration.");
  }

  const salt=fromBase64(data.salt);
  const savedHash=fromBase64(data.hash);
  const enteredHash=await makeHash(password,salt,data.iterations);

  if(!compareHash(savedHash,enteredHash)){
   $("password").value="";
   $("message").textContent="Incorrect Secret Password.";
   $("loginBtn").disabled=false;
   return;
  }

  if(auth.currentUser?.uid!==OWNER_UID)
   throw new Error("Owner account verification failed.");

  sessionStorage.setItem("chessMasterAdminSession",JSON.stringify({
   uid:OWNER_UID,
   verifiedAt:Date.now()
  }));

  $("message").textContent="Login Successful! Opening Admin Panel...";

  window.location.replace("./admin.html");

 }catch(error){
  $("message").textContent="Error: "+error.message;
  $("loginBtn").disabled=false;
 }
});
</script>
</body>
</html>
