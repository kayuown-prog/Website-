<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Master - Premium Bot</title><style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --blue: #00aaff;
  --cyan: #22d3ee;
  --gold: #f5c451;
  --navy: #050d1b;
  --panel: #0b1930;
}

body {
  min-height: 100vh;
  padding: 15px;
  text-align: center;
  font-family: Arial, sans-serif;
  color: #f5f8ff;
  background:
    radial-gradient(ellipse at 50% 15%, #123c70 0%, transparent 45%),
    radial-gradient(ellipse at 0% 65%, #073c65 0%, transparent 40%),
    radial-gradient(ellipse at 100% 75%, #102b64 0%, transparent 40%),
    linear-gradient(145deg, #020714, #07182e 55%, #020817);
  overflow-x: hidden;
}

header {
  padding: 18px 5px 22px;
  font-size: clamp(25px, 6vw, 38px);
  font-weight: 900;
  letter-spacing: 1px;
  color: var(--gold);
  text-shadow: 0 0 15px #d99c28;
}

header small {
  display: block;
  margin-top: 7px;
  font-size: 11px;
  letter-spacing: 5px;
  color: var(--cyan);
}

.game-container {
  width: 100%;
  max-width: 570px;
  margin: auto;
  padding: 14px;
  border-radius: 23px;
  background: linear-gradient(145deg, #102442, #071326 75%);
  border: 1px solid #168dce;
  box-shadow:
    0 0 12px #008cff55,
    0 0 35px #005caa35,
    inset 0 0 22px #0077bb18;
}

.info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 15px 12px;
  margin-bottom: 14px;
  border-radius: 13px;
  background: linear-gradient(110deg, #071426, #102744);
  border: 1px solid #146ca6;
  box-shadow: 0 0 12px #008cff25;
  font-size: clamp(13px, 3.5vw, 17px);
  font-weight: bold;
}

#status {
  color: var(--gold);
  text-shadow: 0 0 9px #ffbd4380;
}

#board {
  width: 100%;
  aspect-ratio: 1;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  border: 5px solid #a87935;
  border-radius: 12px;
  overflow: hidden;
  box-shadow:
    0 0 0 2px #f5d48a,
    0 0 20px #00aaff55,
    0 0 35px #000;
}

.square {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: clamp(29px, 8.2vw, 56px);
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  transition: background .12s ease;
}

.light {
  background: linear-gradient(140deg, #fff5df, #dfd1b2);
}

.dark {
  background: linear-gradient(140deg, #267d8c, #12465d);
}

.square:active {
  filter: brightness(1.18);
}

.white-piece {
  color: #ffffff;
  font-family: "DejaVu Sans", "Segoe UI Symbol", serif;
  font-weight: normal;
  line-height: 1;
  z-index: 2;
  transform: translateY(-1px);
  -webkit-text-stroke: 1px #39485b;
  text-shadow:
    0 2px 1px #14202d,
    1px 3px 2px #14202d,
    0 0 7px #ffffffb0,
    0 0 13px #dcefff75;
}

.black-piece {
  color: #080d17;
  font-family: "DejaVu Sans", "Segoe UI Symbol", serif;
  font-weight: normal;
  line-height: 1;
  z-index: 2;
  transform: translateY(-1px);
  -webkit-text-stroke: 1px #65748b;
  text-shadow:
    0 2px 1px #000,
    1px 3px 3px #000,
    0 0 6px #9bb4d1;
}

.selected {
  background: #e9c94b !important;
  box-shadow: inset 0 0 0 4px #fff0a0;
}

.last-move {
  background: #a5cf43 !important;
}

.dot {
  width: 23%;
  height: 23%;
  border-radius: 50%;
  background: #00b77c;
  opacity: .75;
  position: absolute;
  z-index: 3;
  box-shadow: 0 0 9px #00ffad;
  pointer-events: none;
}

.capture {
  position: absolute;
  inset: 4px;
  border: 4px solid #00c58b;
  border-radius: 50%;
  opacity: .8;
  z-index: 3;
  pointer-events: none;
}

.coordinates {
  position: absolute;
  font-size: clamp(8px, 2vw, 11px);
  font-weight: 900;
  z-index: 4;
  pointer-events: none;
}

.rank-coordinate {
  top: 3px;
  left: 4px;
}

.file-coordinate {
  bottom: 2px;
  right: 4px;
}

.light .coordinates {
  color: #35445a;
}

.dark .coordinates {
  color: #e8f5ff;
}

.controls {
  margin-top: 20px;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 9px;
}

button, #difficulty {
  min-width: 0;
  width: 100%;
  min-height: 48px;
  padding: 10px 6px;
  border-radius: 12px;
  font-size: clamp(11px, 3vw, 15px);
  font-weight: bold;
  cursor: pointer;
  transition: .2s ease;
}

#difficulty {
  color: white;
  background: linear-gradient(145deg, #102d4f, #07172b);
  border: 1px solid #168dce;
  outline: none;
}

button {
  color: white;
  background: linear-gradient(145deg, #123b68, #07172e);
  border: 1px solid #00aaff;
  box-shadow: 0 0 10px #008cff35;
}

button:hover {
  filter: brightness(1.25);
  box-shadow: 0 0 17px #00aaff80;
}

button:active {
  transform: scale(.97);
}

.controls button:first-of-type {
  color: #16100a;
  background: linear-gradient(145deg, #ffe38b, #d79a23);
  border: 1px solid #fff0a5;
  box-shadow: 0 0 15px #f4bd4d70;
}

#message {
  color: #dcecff;
  margin-top: 19px;
  min-height: 24px;
  font-size: 14px;
  font-weight: 600;
  text-shadow: 0 0 8px #008cff55;
}

@media(max-width:400px) {
  body {
    padding: 7px;
  }

  header {
    padding: 13px 5px 17px;
  }

  .game-container {
    padding: 9px;
    border-radius: 17px;
  }

  .info {
    padding: 12px 8px;
  }

  #board {
    border-width: 3px;
  }

  .controls {
    gap: 6px;
  }

  button, #difficulty {
    min-height: 45px;
    border-radius: 9px;
  }
}
</style></head><body><header>
  ♞ CHESS MASTER
  <small>PLAY • THINK • WIN</small>
</header><div class="game-container">  <div class="info">
    <span>♙ YOU - WHITE</span>
    <span id="status">Your Turn</span>
  </div>  <div id="board"></div>  <div class="controls"><select id="difficulty">
  <option value="easy">Easy Bot</option>
  <option value="normal" selected>Normal Bot</option>
</select>

<button onclick="newGame()">New Game</button>

<button onclick="location.href='dashboard.html'">
  Dashboard
</button>

  </div>  <div id="message">Select a white piece to play.</div></div><script type="module">

import { Chess } from
"https://esm.sh/chess.js@1.4.0";

let game = new Chess();
let selected = null;
let possibleMoves = [];
let botThinking = false;
let lastMove = null;
let botTimer = null;

const boardElement = document.getElementById("board");
const statusElement = document.getElementById("status");
const messageElement = document.getElementById("message");

const pieces = {
  w: {
    k:"♔", q:"♕", r:"♖",
    b:"♗", n:"♘", p:"♙"
  },
  b: {
    k:"♚", q:"♛", r:"♜",
    b:"♝", n:"♞", p:"♟︎"
  }
};

function render() {

  boardElement.innerHTML = "";

  const files = "abcdefgh";

  for(let r=0;r<8;r++) {

    for(let c=0;c<8;c++) {

      const square = files[c] + (8-r);
      const piece = game.get(square);

      const div = document.createElement("div");

      div.className =
        "square " + ((r+c)%2 ? "dark" : "light");

      if(selected === square) {
        div.classList.add("selected");
      }

      if(lastMove &&
         (lastMove.from === square ||
          lastMove.to === square)) {
        div.classList.add("last-move");
      }

      if(piece) {

        const span = document.createElement("span");

        span.textContent = pieces[piece.color][piece.type];

        span.className =
          piece.color === "w" ?
          "white-piece" : "black-piece";

        div.appendChild(span);

      }

      if(possibleMoves.some(m=>m.to===square)) {

        const marker = document.createElement("div");

        marker.className = piece ? "capture" : "dot";

        div.appendChild(marker);
      }

      if(c===0) {
        const rank = document.createElement("span");
        rank.className = "coordinates rank-coordinate";
        rank.textContent = 8-r;
        div.appendChild(rank);
      }

      if(r===7) {
        const file = document.createElement("span");
        file.className = "coordinates file-coordinate";
        file.textContent = files[c];
        div.appendChild(file);
      }

      div.addEventListener("click",()=>clickSquare(square));

      boardElement.appendChild(div);

    }
  }

  updateStatus();
}

function updateStatus() {

  if(game.isCheckmate()) {
    statusElement.textContent =
      game.turn()==="w" ? "Bot Wins!" : "You Win!";
    messageElement.textContent = "Checkmate!";
    return;
  }

  if(game.isStalemate()) {
    statusElement.textContent = "Draw!";
    messageElement.textContent = "Stalemate.";
    return;
  }

  if(game.isDraw()) {
    statusElement.textContent = "Draw!";
    messageElement.textContent = "Game drawn.";
    return;
  }

  if(game.isCheck()) {
    statusElement.textContent = "Check!";
  } else {
    statusElement.textContent =
      game.turn()==="w" ? "Your Turn" : "Bot's Turn";
  }

}

function clickSquare(square) {

  if(botThinking || game.isGameOver() ||
     game.turn()!=="w") return;

  const piece = game.get(square);

  if(selected === null) {

    if(piece && piece.color==="w") {
      selected = square;
      possibleMoves = game.moves({
        square,
        verbose:true
      });
      messageElement.textContent =
        "Choose a highlighted square.";
      render();
    }

    return;
  }

  if(piece && piece.color==="w") {

    selected = square;
    possibleMoves = game.moves({
      square,
      verbose:true
    });

    render();
    return;
  }

  const valid = possibleMoves.some(m=>m.to===square);

  if(!valid) {
    selected = null;
    possibleMoves = [];
    render();
    return;
  }

  try {

    const move = game.move({
      from:selected,
      to:square,
      promotion:"q"
    });

    lastMove = {
      from:move.from,
      to:move.to
    };

    selected = null;
    possibleMoves = [];

    render();

    if(!game.isGameOver()) {
      botThinking = true;
      messageElement.textContent = "Bot is thinking...";
      botTimer = setTimeout(botMove,650);
    }

  } catch(error) {
    messageElement.textContent = "Invalid move.";
  }

}

function botMove() {

  botTimer = null;

  if(game.isGameOver() || game.turn()!=="b") {
    botThinking = false;
    render();
    return;
  }

  const moves = game.moves({verbose:true});

  if(moves.length===0) {
    botThinking = false;
    render();
    return;
  }

  let chosen;

  const difficulty =
    document.getElementById("difficulty").value;

  if(difficulty==="easy") {

    chosen = moves[
      Math.floor(Math.random()*moves.length)
    ];

  } else {

    const captures = moves.filter(m=>m.captured);

    chosen = captures.length &&
      Math.random()<0.65 ?
      captures[Math.floor(Math.random()*captures.length)] :
      moves[Math.floor(Math.random()*moves.length)];

  }

  const move = game.move({
    from:chosen.from,
    to:chosen.to,
    promotion:"q"
  });

  lastMove = {
    from:move.from,
    to:move.to
  };

  botThinking = false;
  render();

  if(game.isCheckmate()) {
    messageElement.textContent = "Bot wins!";
  } else if(game.isDraw()) {
    messageElement.textContent = "Game drawn!";
  } else {
    messageElement.textContent = "Your turn!";
  }

}

function newGame() {

  if(botTimer !== null) {
    clearTimeout(botTimer);
    botTimer = null;
  }

  game = new Chess();

  selected = null;
  possibleMoves = [];
  botThinking = false;
  lastMove = null;

  messageElement.textContent =
    "New game started. Your turn!";

  render();

}

newGame();

</script></body>
  </html>
