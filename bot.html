
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Master - Play Bot</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #10141c;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  text-align: center;
  padding: 15px;
}

header {
  padding: 15px;
  color: #f5c76a;
  font-size: 25px;
  font-weight: bold;
}

.game-container {
  max-width: 540px;
  margin: auto;
  background: #1b2433;
  padding: 15px;
  border-radius: 15px;
  border: 1px solid #4b5563;
}

.info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px;
  margin-bottom: 12px;
  background: #10141c;
  border-radius: 8px;
  gap: 8px;
}

#status {
  color: #f5c76a;
  font-weight: bold;
}

#board {
  width: 100%;
  aspect-ratio: 1;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  border: 5px solid #79512e;
  border-radius: 4px;
  overflow: hidden;
}

.square {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: clamp(27px, 8vw, 55px);
  cursor: pointer;
  user-select: none;
}

.light {
  background: #f0d9b5;
}

.dark {
  background: #779556;
}

.white-piece {
  color: #fffdf4;
  text-shadow:
    1px 1px 2px #222,
    -1px -1px 2px #222;
}

.black-piece {
  color: #171717;
  text-shadow: 0 1px 1px #aaa;
}

.selected {
  background: #d6c445 !important;
}

.last-move {
  background: #baca44 !important;
}

.dot {
  width: 25%;
  height: 25%;
  border-radius: 50%;
  background: #284c2c;
  opacity: .65;
  position: absolute;
}

.capture {
  position: absolute;
  inset: 3px;
  border: 4px solid #284c2c;
  border-radius: 50%;
  opacity: .6;
}

.coordinates {
  position: absolute;
  font-size: 10px;
  font-weight: bold;
  bottom: 2px;
  right: 3px;
  color: #333;
}

.controls {
  margin-top: 18px;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
}

button {
  padding: 12px 19px;
  border: none;
  border-radius: 8px;
  background: #d6a84b;
  color: #10141c;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #f5c76a;
}

#difficulty {
  background: #29364b;
  color: white;
  padding: 10px;
  border-radius: 7px;
  border: 1px solid #555;
}

#message {
  color: #ddd;
  margin-top: 15px;
  min-height: 22px;
  font-size: 14px;
}

@media(max-width:400px) {
  body { padding: 7px; }
  .game-container { padding: 8px; }
}
</style>
</head>

<body>

<header>♟ CHESS MASTER</header>

<div class="game-container">

  <div class="info">
    <span>♙ YOU - WHITE</span>
    <span id="status">Your turn</span>
  </div>

  <div id="board"></div>

  <div class="controls">

    <select id="difficulty">
      <option value="easy">Easy Bot</option>
      <option value="normal">Normal Bot</option>
    </select>

    <button onclick="newGame()">New Game</button>

    <button onclick="location.href='dashboard.html'">
      Dashboard
    </button>

  </div>

  <div id="message">Select a white piece to play.</div>

</div>

<script type="module">

import { Chess } from
"https://esm.sh/chess.js@1.4.0";

let game = new Chess();
let selected = null;
let possibleMoves = [];
let botThinking = false;
let lastMove = null;

const boardElement = document.getElementById("board");
const statusElement = document.getElementById("status");
const messageElement = document.getElementById("message");

const pieces = {
  w: {
    k:"♔", q:"♕", r:"♖",
    b:"♗", n:"♘", p:"♙"
  },
  b: {
    k:"♚", q:"♛", r:"♜",
    b:"♝", n:"♞", p:"♟"
  }
};

function render() {

  boardElement.innerHTML = "";

  const files = "abcdefgh";

  for(let r=0;r<8;r++) {

    for(let c=0;c<8;c++) {

      const square = files[c] + (8-r);
      const piece = game.get(square);

      const div = document.createElement("div");

      div.className =
        "square " + ((r+c)%2 ? "dark" : "light");

      if(selected === square) {
        div.classList.add("selected");
      }

      if(lastMove &&
         (lastMove.from === square ||
          lastMove.to === square)) {
        div.classList.add("last-move");
      }

      if(piece) {

        const span = document.createElement("span");

        span.textContent = pieces[piece.color][piece.type];

        span.className =
          piece.color === "w" ?
          "white-piece" : "black-piece";

        div.appendChild(span);

      }

      if(possibleMoves.some(m=>m.to===square)) {

        const marker = document.createElement("div");

        if(piece) {
          marker.className = "capture";
        } else {
          marker.className = "dot";
        }

        div.appendChild(marker);
      }

      if(c===0) {
        const rank = document.createElement("span");
        rank.className = "coordinates";
        rank.textContent = 8-r;
        div.appendChild(rank);
      }

      if(r===7) {
        const file = document.createElement("span");
        file.className = "coordinates";
        file.textContent = files[c];
        div.appendChild(file);
      }

      div.addEventListener("click",()=>clickSquare(square));

      boardElement.appendChild(div);

    }
  }

  updateStatus();
}

function updateStatus() {

  if(game.isCheckmate()) {
    statusElement.textContent =
      game.turn()==="w" ?
      "Bot Wins!" : "You Win!";
    messageElement.textContent = "Checkmate!";
    return;
  }

  if(game.isStalemate()) {
    statusElement.textContent = "Draw!";
    messageElement.textContent = "Stalemate.";
    return;
  }

  if(game.isDraw()) {
    statusElement.textContent = "Draw!";
    messageElement.textContent = "Game drawn.";
    return;
  }

  if(game.isCheck()) {
    statusElement.textContent = "Check!";
  } else {
    statusElement.textContent =
      game.turn()==="w" ? "Your Turn" : "Bot's Turn";
  }

}

function clickSquare(square) {

  if(botThinking || game.isGameOver() ||
     game.turn()!=="w") return;

  const piece = game.get(square);

  if(selected === null) {

    if(piece && piece.color==="w") {
      selected = square;
      possibleMoves = game.moves({
        square,
        verbose:true
      });
      messageElement.textContent =
        "Choose a highlighted square.";
      render();
    }

    return;
  }

  if(piece && piece.color==="w") {

    selected = square;
    possibleMoves = game.moves({
      square,
      verbose:true
    });

    render();
    return;
  }

  const valid = possibleMoves.some(m=>m.to===square);

  if(!valid) {
    selected = null;
    possibleMoves = [];
    render();
    return;
  }

  try {

    const move = game.move({
      from:selected,
      to:square,
      promotion:"q"
    });

    lastMove = {
      from:move.from,
      to:move.to
    };

    selected = null;
    possibleMoves = [];

    render();

    if(!game.isGameOver()) {
      botThinking = true;
      messageElement.textContent = "Bot is thinking...";
      setTimeout(botMove,650);
    }

  } catch(error) {
    messageElement.textContent = "Invalid move.";
  }

}

function botMove() {

  if(game.isGameOver()) {
    botThinking = false;
    render();
    return;
  }

  const moves = game.moves({verbose:true});

  if(moves.length===0) {
    botThinking = false;
    render();
    return;
  }

  let chosen;

  const difficulty =
    document.getElementById("difficulty").value;

  if(difficulty==="easy") {

    chosen = moves[
      Math.floor(Math.random()*moves.length)
    ];

  } else {

    const captures = moves.filter(m=>m.captured);

    chosen = captures.length &&
      Math.random()<0.65 ?
      captures[Math.floor(Math.random()*captures.length)] :
      moves[Math.floor(Math.random()*moves.length)];

  }

  const move = game.move({
    from:chosen.from,
    to:chosen.to,
    promotion:"q"
  });

  lastMove = {
    from:move.from,
    to:move.to
  };

  botThinking = false;
  render();

  if(game.isCheckmate()) {
    messageElement.textContent = "Bot wins!";
  } else if(game.isDraw()) {
    messageElement.textContent = "Game drawn!";
  } else {
    messageElement.textContent = "Your turn!";
  }

}

function newGame() {

  game = new Chess();

  selected = null;
  possibleMoves = [];
  botThinking = false;
  lastMove = null;

  messageElement.textContent =
    "New game started. Your turn!";

  render();

}

newGame();

</script>

</body>
</html>
