
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess vs Bot</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  background: #101820;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: #f5d76e;
  margin: 12px 0;
}

.container {
  max-width: 520px;
  margin: auto;
}

.status {
  background: #243442;
  padding: 13px;
  border-radius: 10px;
  margin: 15px 0;
  font-size: 16px;
}

.board {
  width: min(92vw, 480px);
  aspect-ratio: 1;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  margin: auto;
  border: 4px solid #d5b16d;
  border-radius: 5px;
  overflow: hidden;
}

.square {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  cursor: pointer;
  user-select: none;
  aspect-ratio: 1;
}

.light {
  background: #f0d9b5;
}

.dark {
  background: #b58863;
}

.piece {
  font-family: "DejaVu Sans", "Segoe UI Symbol", serif;
  font-size: clamp(25px, 8vw, 48px);
  line-height: 1;
  font-weight: normal;
  z-index: 2;
  pointer-events: none;
}

.white-piece {
  color: #ffffff;
  -webkit-text-stroke: 1px #333333;
  text-shadow: 0 1px 2px #333;
}

.black-piece {
  color: #171717;
  -webkit-text-stroke: 0.5px #000;
}

.selected {
  background: #e9d34c !important;
}

.possible::after {
  content: "";
  width: 25%;
  height: 25%;
  background: #267b45;
  opacity: 0.75;
  border-radius: 50%;
  position: absolute;
}

.capture::after {
  content: "";
  position: absolute;
  width: 85%;
  height: 85%;
  border: 4px solid #267b45;
  border-radius: 50%;
}

.buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 18px 0;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 8px;
  background: #e6c568;
  color: #111;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

.note {
  color: #c6d2dc;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

<h1>♟ Chess vs Bot</h1>

<div class="status" id="status">
Your turn — White
</div>

<div class="board" id="board"></div>

<div class="buttons">
<button onclick="undoMove()">Undo</button>
<button onclick="restartGame()">Restart</button>
</div>

<p class="note">
White pieces are yours. Black pieces are controlled by the computer.
</p>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script>
const game = new Chess();

const board = document.getElementById("board");
const status = document.getElementById("status");

let selected = null;
let possible = [];

const pieces = {
  wk: "♔", wq: "♕", wr: "♖",
  wb: "♗", wn: "♘", wp: "♙",
  bk: "♚", bq: "♛", br: "♜",
  bb: "♝", bn: "♞", bp: "♟"
};

function renderBoard() {
  board.innerHTML = "";

  const files = "abcdefgh";

  for (let r = 7; r >= 0; r--) {
    for (let f = 0; f < 8; f++) {
      const square = files[f] + (r + 1);
      const piece = game.get(square);

      const div = document.createElement("div");

      div.className =
        "square " + ((r + f) % 2 === 0 ? "light" : "dark");

      if (selected === square) {
        div.classList.add("selected");
      }

      if (possible.includes(square)) {
        div.classList.add(
          piece ? "capture" : "possible"
        );
      }

      if (piece) {
        const span = document.createElement("span");
        span.className =
          "piece " +
          (piece.color === "w" ? "white-piece" : "black-piece");

        span.textContent = pieces[piece.color + piece.type];
        div.appendChild(span);
      }

      div.onclick = () => selectSquare(square);

      board.appendChild(div);
    }
  }

  updateStatus();
}

function selectSquare(square) {
  if (game.game_over() || game.turn() !== "w") return;

  const piece = game.get(square);

  if (selected && possible.includes(square)) {
    makeMove(selected, square);
    return;
  }

  if (piece && piece.color === "w") {
    selected = square;

    possible = game.moves({
      square: square,
      verbose: true
    }).map(move => move.to);
  } else {
    selected = null;
    possible = [];
  }

  renderBoard();
}

function makeMove(from, to) {
  let move = game.move({
    from: from,
    to: to,
    promotion: "q"
  });

  selected = null;
  possible = [];

  if (!move) {
    renderBoard();
    return;
  }

  renderBoard();

  if (!game.game_over()) {
    status.textContent = "Computer is thinking...";
    setTimeout(botMove, 450);
  }
}

function botMove() {
  if (game.game_over()) {
    updateStatus();
    return;
  }

  const moves = game.moves();

  if (!moves.length) {
    updateStatus();
    return;
  }

  const move = moves[Math.floor(Math.random() * moves.length)];

  game.move(move);
  renderBoard();
}

function undoMove() {
  if (game.history().length === 0) return;

  game.undo();

  if (game.turn() === "b" && game.history().length > 0) {
    game.undo();
  }

  selected = null;
  possible = [];
  renderBoard();
}

function restartGame() {
  game.reset();
  selected = null;
  possible = [];
  renderBoard();
}

function updateStatus() {
  if (game.in_checkmate()) {
    status.textContent = "Checkmate! " +
      (game.turn() === "w" ? "Black" : "White") + " wins!";
  } else if (game.in_draw()) {
    status.textContent = "Game Draw!";
  } else if (game.in_check()) {
    status.textContent =
      (game.turn() === "w" ? "White" : "Black") + " is in check!";
  } else {
    status.textContent =
      game.turn() === "w" ? "Your turn — White" : "Bot turn — Black";
  }
}

renderBoard();
</script>

</body>
</html>
