<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-
scale=1">
<title>CHESS MASTER - Bot</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10141c;color:#fff;font-family:Arial;text-align:center;
padding:18px}
h1{color:#e7b85c}.board{width:min(92vw,520px);aspect-ratio:1;margin:18px auto;display:grid;grid-template-
columns:repeat(8,1fr);border:4px solid #394557}
.sq{display:grid;place-items:center;font-size:clamp(24px,7vw,48px);cursor:pointer;user-select:none}
.light{background:#f0d9b5;color:#111}.dark{background:#779556;color:#111}.selected{outline:4px solid 
#f5c451;outline-offset:-4px}
button,a{padding:12px 18px;margin:5px;border:0;border-radius:8px;background:#e7b85c;color:#111;font-
weight:bold;text-decoration:none;cursor:pointer}
#status{min-height:24px;color:#ffd27a}
</style></head><body><h1>■ PLAY VS BOT</h1><p id="status">Your turn — White</p><div id="board" 
class="board"></div>
<button id="newGame">NEW GAME</button><a href="dashboard.html">DASHBOARD</a>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>
<script>
const game=new Chess(), board=document.getElementById('board'), statusEl=document.getElementById(
'status');
const glyph={wk:'■',wq:'■',wr:'■',wb:'■',wn:'■',wp:'■',bk:'■',bq:'■',br:'■',bb:'■',bn:'■',bp:'■'};
let selected=null, locked=false;
function draw(){
 board.innerHTML='';const b=game.board();
 b.forEach((row,r)=>row.forEach((p,c)=>{
 const sq=document.createElement('div');sq.className='sq '+((r+c)%2?'dark':'light');
 const file='abcdefgh'[c],rank=8-r,square=file+rank;
 if(selected===square)sq.classList.add('selected');
 sq.textContent=p?glyph[p.color+p.type]:'';
 sq.onclick=()=>tap(square);board.appendChild(sq);
 }));
 if(game.game_over())statusEl.textContent=game.in_checkmate()?'Checkmate! '+(game.turn()==='w'?'Black':
'White')+' wins.': 'Game over — draw.';
 else statusEl.textContent=(game.turn()==='w'?'Your turn — White':'Bot thinking...')+(game.in_check()?' (
Check)':'');
}
function tap(sq){
 if(locked||game.game_over()||game.turn()!=='w')return;
 const piece=game.get(sq);
 if(selected){const move=game.move({from:selected,to:sq,promotion:'q'});selected=null;
 if(move){draw();if(!game.game_over()){locked=true;setTimeout(botMove,450)}return}
 }
 if(piece&&piece.color==='w')selected=sq;else selected=null;draw();
}
function botMove(){
 const moves=game.moves();if(moves.length){const captures=moves.filter(m=>m.includes('x'));const 
pool=captures.length&&Math.random()<.65?captures:moves;game.move(pool[Math.floor(Math.random()*pool.
length)])}
 locked=false;draw();
}
document.getElementById('newGame').onclick=()=>{game.reset();selected=null;locked=false;draw()};
draw();
</script></body></html>
