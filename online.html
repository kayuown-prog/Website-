
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Master - Online</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#10141c;color:white;font-family:Arial;
 text-align:center;padding:15px
}
h1{color:#f5c76a;margin:15px}
button{
 padding:12px 20px;margin:8px;border:0;
 border-radius:7px;background:#d6a84b;
 font-weight:bold;cursor:pointer
}
#board{
 width:min(92vw,480px);aspect-ratio:1;
 display:grid;grid-template-columns:repeat(8,1fr);
 margin:20px auto;border:4px solid #d6a84b
}
.square{
 display:flex;align-items:center;justify-content:center;
 font-size:clamp(25px,8vw,48px);cursor:pointer
}
.light{background:#f0d9b5}
.dark{background:#779556}
.selected{background:#e6d34c}
#game{display:none}
#status{margin:15px}
</style>
</head>

<body>

<h1>♟ CHESS MASTER ONLINE</h1>

<div id="lobby">
<h2>Online Matchmaking</h2>
<p id="status">Find a player to start</p>
<button id="findBtn">Find Opponent</button>
<button id="cancelBtn">Cancel Search</button>
<br>
<button onclick="location.href='dashboard.html'">Dashboard</button>
</div>

<div id="game">
<h3 id="role"></h3>
<p id="gameStatus">Game started</p>
<div id="board"></div>
<button onclick="location.href='dashboard.html'">Exit</button>
</div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getDatabase,ref,get,set,update,onValue,runTransaction,
 remove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
 getAuth,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// SAME FIREBASE CONFIG AS LOGIN.HTML
const firebaseConfig={
 apiKey:"YOUR_API_KEY",
 authDomain:"YOUR_AUTH_DOMAIN",
 databaseURL:"https://freedroid-cloud-default-rtdb.firebaseio.com",
 projectId:"freedroid-cloud",
 storageBucket:"YOUR_STORAGE_BUCKET",
 messagingSenderId:"YOUR_MESSAGING_SENDER_ID",
 appId:"YOUR_APP_ID"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const auth=getAuth(app);

let uid=null,room=null,player=null,selected=null;
let unsubscribe=null,searching=false,matchRef=null;
let board=[],turn="white",finished=false;

const initial=[
["♜","♞","♝","♛","♚","♝","♞","♜"],
["♟","♟","♟","♟","♟","♟","♟","♟"],
["","","","","","","",""],
["","","","","","","",""],
["","","","","","","",""],
["","","","","","","",""],
["♙","♙","♙","♙","♙","♙","♙","♙"],
["♖","♘","♗","♕","♔","♗","♘","♖"]
];

const white="♙♖♘♗♕♔";
const black="♟♜♝♛♚";

function color(p){
 if(white.includes(p))return "white";
 if(black.includes(p))return "black";
 return null;
}

function status(t){
 document.getElementById("status").textContent=t;
 document.getElementById("gameStatus").textContent=t;
}

onAuthStateChanged(auth,user=>{
 if(user){
  uid=user.uid;
 }else{
  location.replace("login.html");
 }
});

async function findOpponent(){
 if(!uid)return status("Please wait for login...");
 if(searching)return;

 searching=true;
 document.getElementById("findBtn").disabled=true;
 status("Searching for opponent...");

 try{
  const queueRef=ref(db,"onlineQueue");
  const result=await runTransaction(queueRef,current=>{
   current=current||{};
   const waiting=Object.keys(current).find(id=>
    id!==uid&&current[id]?.status==="waiting"
   );

   if(waiting){
    current[waiting].status="matched";
    current[waiting].opponent=uid;
    current[uid]={status:"matched",opponent:waiting};
   }else{
    current[uid]={status:"waiting"};
   }
   return current;
  });

  const data=result.snapshot.val();
  const entry=data[uid];

  if(entry?.status==="matched"){
   room=[uid,entry.opponent].sort().join("_");
   player=uid===room.split("_")[0]?"white":"black";

   matchRef=ref(db,"onlineMatches/"+room);

   await runTransaction(matchRef,current=>{
    if(current)return current;
    return {
     board:initial,
     turn:"white",
     players:{
      white:room.split("_")[0],
      black:room.split("_")[1]
     },
     status:"playing"
    };
   });

   await remove(ref(db,"onlineQueue/"+uid));
   await remove(ref(db,"onlineQueue/"+entry.opponent));

   startGame();
  }else{
   status("Waiting for another player...");
   watchQueue();
  }
 }catch(e){
  searching=false;
  document.getElementById("findBtn").disabled=false;
  status(e.message);
 }
}

function watchQueue(){
 const qref=ref(db,"onlineQueue/"+uid);
 unsubscribe=onValue(qref,snap=>{
  const data=snap.val();
  if(data?.status==="matched"&&searching){
   searching=false;
   room=[uid,data.opponent].sort().join("_");
   player=uid===room.split("_")[0]?"white":"black";
   matchRef=ref(db,"onlineMatches/"+room);
   startGame();
   remove(qref);
  }
 });
}

async function cancelSearch(){
 searching=false;
 if(unsubscribe){unsubscribe();unsubscribe=null}
 await remove(ref(db,"onlineQueue/"+uid));
 document.getElementById("findBtn").disabled=false;
 status("Search cancelled");
}

function startGame(){
 document.getElementById("lobby").style.display="none";
 document.getElementById("game").style.display="block";
 document.getElementById("role").textContent="You are "+player;

 if(unsubscribe){unsubscribe();unsubscribe=null}

 unsubscribe=onValue(matchRef,snap=>{
  if(!snap.exists())return;
  const data=snap.val();
  board=data.board;
  turn=data.turn;
  finished=data.status==="finished";
  render();

  if(finished){
   status(data.winner===player?"You won!":"You lost!");
  }else{
   status(turn===player?"Your turn":"Opponent's turn");
  }
 });
}

function clearPath(sr,sc,r,c){
 const dr=Math.sign(r-sr),dc=Math.sign(c-sc);
 let x=sr+dr,y=sc+dc;
 while(x!==r||y!==c){
  if(board[x][y])return false;
  x+=dr;y+=dc;
 }
 return true;
}

function legal(sr,sc,r,c){
 const p=board[sr][sc],t=board[r][c];
 if(!p||color(p)!==player||color(t)===player)return false;
 const dr=r-sr,dc=c-sc,ar=Math.abs(dr),ac=Math.abs(dc);

 if(p==="♙")return (dc===0&&!t&&dr===-1)||
 (dc===0&&sr===6&&dr===-2&&!board[5][sc])||
 (dr===-1&&ac===1&&color(t)==="black");

 if(p==="♟")return (dc===0&&!t&&dr===1)||
 (dc===0&&sr===1&&dr===2&&!board[2][sc])||
 (dr===1&&ac===1&&color(t)==="white");

 if(p==="♘"||p==="♞")return (ar===2&&ac===1)||(ar===1&&ac===2);
 if(p==="♖"||p==="♜")return (dr===0||dc===0)&&clearPath(sr,sc,r,c);
 if(p==="♗"||p==="♝")return ar===ac&&clearPath(sr,sc,r,c);
 if(p==="♕"||p==="♛")return (dr===0||dc===0||ar===ac)&&clearPath(sr,sc,r,c);
 if(p==="♔"||p==="♚")return ar<=1&&ac<=1&&(ar+ac>0);
 return false;
}

function render(){
 const el=document.getElementById("board");
 el.innerHTML="";

 for(let r=0;r<8;r++){
  for(let c=0;c<8;c++){
   const sq=document.createElement("div");
   sq.className="square "+((r+c)%2?"dark":"light");
   sq.textContent=board[r][c];
   if(selected?.[0]===r&&selected?.[1]===c)
    sq.classList.add("selected");
   sq.onclick=()=>clickSquare(r,c);
   el.appendChild(sq);
  }
 }
}

async function clickSquare(r,c){
 if(finished||turn!==player)return;

 if(!selected){
  if(color(board[r][c])===player){
   selected=[r,c];render();
  }
  return;
 }

 const [sr,sc]=selected;

 if(sr===r&&sc===c){selected=null;render();return}
 if(color(board[r][c])===player){selected=[r,c];render();return}
 if(!legal(sr,sc,r,c))return;

 const newBoard=board.map(row=>[...row]);
 const captured=newBoard[r][c];

 newBoard[r][c]=newBoard[sr][sc];
 newBoard[sr][sc]="";

 if(newBoard[r][c]==="♙"&&r===0)newBoard[r][c]="♕";
 if(newBoard[r][c]==="♟"&&r===7)newBoard[r][c]="♛";

 const kingCaptured=captured==="♚"||captured==="♔";
 selected=null;

 try{
  await runTransaction(matchRef,current=>{
   if(!current||current.status!=="playing"||current.turn!==player)return;
   current.board=newBoard;
   if(kingCaptured){
    current.status="finished";
    current.winner=player;
   }else{
    current.turn=player==="white"?"black":"white";
   }
   return current;
  });
 }catch(e){
  status(e.message);
 }
}

document.getElementById("findBtn").onclick=findOpponent;
document.getElementById("cancelBtn").onclick=cancelSearch;

</script>
</body>
  </html>
