
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-
scale=1">
<title>CHESS MASTER - Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10141c;color:#fff;font-family:Arial}
header{padding:20px;text-align:center;background:#1c2431;border-bottom:1px solid #344256}
h1{color:#e7b85c;margin:0}.wrap{max-width:850px;margin:35px auto;padding:18px}
.welcome{text-align:center;color:#c5ceda;margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.card{background:#1c2431;padding:24px;border-radius:16px;text-align:center;border:1px solid #344256}
.card h2{margin-top:0}.card p{color:#aab4c3;min-height:40px}
a.btn,button{display:inline-block;padding:13px 18px;background:#e7b85c;color:#171717;text-decoration:
none;border:0;border-radius:9px;font-weight:bold;cursor:pointer}
.logout{display:block;margin:28px auto;background:#344256;color:#fff}
</style></head><body>
<header><h1>■ CHESS MASTER</h1></header>
<main class="wrap"><div class="welcome"><h2 id="welcome">Welcome!</h2><div id="userEmail">Checking 
account...</div></div>
<div class="grid">
<section class="card"><h2>■ Play Online</h2><p>Find another player and play a live match.</p><a 
class="btn" href="chess.html">PLAY ONLINE</a></section>
<section class="card"><h2>■ Play vs Bot</h2><p>Practice chess against the computer.</p><a class="btn" 
href="bot.html">PLAY BOT</a></section>
<section class="card"><h2>■ Local Chess</h2><p>Play a game on this device.</p><a class="btn" href="chess.
html?local=1">LOCAL GAME</a></section>
</div><button class="logout" id="logoutBtn">LOGOUT</button><p id="message" style="text-align:center"></
p></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const msg=document.getElementById('message');
auth.onAuthStateChanged(user=>{
 if(!user){location.replace('login.html');return}
 document.getElementById('welcome').textContent='Welcome to CHESS MASTER';
 document.getElementById('userEmail').textContent=user.email||user.uid;
});
document.getElementById('logoutBtn').onclick=async()=>{
 try{await auth.signOut();location.replace('login.html')}catch(e){msg.textContent=e.message}
};
</script></body></html>
