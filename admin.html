
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chess Master - Owner Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#10141c;color:white;min-height:100vh;padding:18px}
.container{max-width:1000px;margin:auto}
h1{color:#f5c76a;text-align:center;margin:15px 0 25px}
h2{color:#f5c76a;margin-bottom:15px;font-size:20px}
.card{background:#1b2330;padding:18px;border-radius:14px;margin-bottom:18px;border:1px solid #303b4c}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:#273447;padding:17px;border-radius:10px;text-align:center}
.stat strong{display:block;font-size:25px;color:#f5c76a;margin-top:8px}
input{width:100%;padding:13px;border:1px solid #536176;border-radius:8px;background:#10141c;color:white;margin:7px 0 12px}
button{padding:11px 15px;border:0;border-radius:8px;background:#e6b94f;color:#171717;font-weight:bold;cursor:pointer;margin:4px}
button.danger{background:#e05252;color:white}
button.green{background:#39a96b;color:white}
.player{background:#273447;padding:12px;border-radius:9px;margin:10px 0;overflow-wrap:anywhere}
.muted{color:#aeb9c9;font-size:13px}
#status{padding:12px;background:#273447;border-radius:8px;margin-bottom:15px;overflow-wrap:anywhere}
.hidden{display:none}
@media(min-width:650px){.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<div class="container">
<h1>♟ Chess Master Admin</h1>
<div id="status">Checking Admin Session...</div>

<div id="dashboard" class="hidden">

<div class="card">
<h2>Owner Dashboard</h2>
<p id="ownerEmail">Checking owner...</p>
<button class="danger" id="logoutBtn">Logout</button>
</div>

<div class="card">
<h2>Website Statistics</h2>
<div class="stats">
<div class="stat">Total Players<strong id="playersCount">0</strong></div>
<div class="stat">Total Wins<strong id="winsCount">0</strong></div>
<div class="stat">Total Losses<strong id="lossesCount">0</strong></div>
<div class="stat">Matchmaking<strong id="matchCount">0</strong></div>
</div>
<button id="refreshBtn">Refresh Data</button>
</div>

<div class="card">
<h2>Search Player</h2>
<input id="playerUid" placeholder="Enter Player UID">
<button id="searchBtn">Search Player</button>
<div id="playerResult"></div>
</div>

<div class="card">
<h2>Leaderboard</h2>
<div id="leaderboardList">Loading players...</div>
</div>

<div class="card">
<h2>Matchmaking Players</h2>
<div id="matchmakingList">Loading matchmaking...</div>
</div>

<div class="card">
<h2>Blocked Players</h2>
<div id="blockedList">Loading blocked players...</div>
</div>

</div>
</div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getDatabase,ref,onValue,get,update,set,remove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAtpvwOOn-7I6eoRR3VK2ZR_IqIy7Hcu0Y",
  authDomain: "freedroid-cloud.firebaseapp.com",
  databaseURL: "https://freedroid-cloud-default-rtdb.firebaseio.com",
  projectId: "freedroid-cloud",
  storageBucket: "freedroid-cloud.firebasestorage.app",
  messagingSenderId: "909415918359",
  appId: "1:909415918359:web:85da71cdd35a879fa86552",
  measurementId: "G-HV2ELB7GS6"
};

const OWNER_UID="rDUXxSYOPchI8eKuIPlyLy0dJdU2";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const $=id=>document.getElementById(id);

let dataLoaded=false;
let redirecting=false;

function status(message){
 $("status").textContent=message;
}

function safe(value){
 return String(value).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}

function safeAttr(value){
 return String(value).replace(/[^a-zA-Z0-9_-]/g,"");
}

function validAdminSession(){
 try{
  const session=JSON.parse(
   sessionStorage.getItem("chessMasterAdminSession")||"null"
  );

  return !!(
   session&&
   session.uid===OWNER_UID&&
   Number.isFinite(session.verifiedAt)&&
   Date.now()>=session.verifiedAt&&
   Date.now()-session.verifiedAt<12*60*60*1000
  );
 }catch(e){
  return false;
 }
}

function showDashboard(user){
 $("dashboard").classList.remove("hidden");
 $("ownerEmail").textContent="Owner: "+(user.email||user.uid);
 status("Admin verified successfully.");
}

function showError(error){
 console.error(error);
 status("Firebase error: "+error.message);
}

function countItems(data){
 return data&&typeof data==="object"
 ?Object.keys(data).length:0;
}

function renderLeaderboard(data){
 const entries=Object.entries(data||{});

 $("playersCount").textContent=entries.length;

 let wins=0,losses=0;

 entries.forEach(([uid,p])=>{
  wins+=Number(p?.wins||0);
  losses+=Number(p?.losses||0);
 });

 $("winsCount").textContent=wins;
 $("lossesCount").textContent=losses;

 $("leaderboardList").innerHTML=entries.length
 ?entries.map(([uid,p])=>`
  <div class="player">
   <b>${safe(p?.name||p?.username||"Player")}</b>
   <p class="muted">UID: ${safe(uid)}</p>
   <p>Points: ${Number(p?.points||0)}
   | Wins: ${Number(p?.wins||0)}
   | Losses: ${Number(p?.losses||0)}</p>
   <button onclick="searchPlayer('${safeAttr(uid)}')">
   View Player</button>
  </div>
 `).join("")
 :"No players found.";
}

function renderMatchmaking(data){
 const entries=Object.entries(data||{});
 $("matchCount").textContent=entries.length;

 $("matchmakingList").innerHTML=entries.length
 ?entries.map(([uid,p])=>`
  <div class="player">
   <b>${safe(p?.name||p?.username||"Player")}</b>
   <p class="muted">UID: ${safe(uid)}</p>
  </div>
 `).join("")
 :"No players waiting.";
}

function renderBlocked(data){
 const entries=Object.entries(data||{});

 $("blockedList").innerHTML=entries.length
 ?entries.map(([uid])=>`
  <div class="player">
   <b>Blocked Player</b>
   <p class="muted">UID: ${safe(uid)}</p>
   <button class="green"
   onclick="unblockPlayer('${safeAttr(uid)}')">
   Unblock</button>
  </div>
 `).join("")
 :"No blocked players.";
}

async function findPlayer(){
 const uid=$("playerUid").value.trim();

 if(!uid){
  $("playerResult").textContent="Please enter a player UID.";
  return;
 }

 $("playerResult").textContent="Searching...";

 try{
  const snap=await get(ref(db,"leaderboard/"+uid));

  if(!snap.exists()){
   $("playerResult").textContent="Player not found.";
   return;
  }

  const p=snap.val()||{};

  $("playerResult").innerHTML=`
   <div class="player">
    <b>${safe(p.name||p.username||"Player")}</b>
    <p class="muted">UID: ${safe(uid)}</p>
    <p>Email: ${safe(p.email||"Not available")}</p>
    <p>Points: ${Number(p.points||0)}</p>
    <p>Wins: ${Number(p.wins||0)}</p>
    <p>Losses: ${Number(p.losses||0)}</p>
    <input id="newPoints" type="number"
    placeholder="Enter new points">
    <button onclick="updatePoints('${safeAttr(uid)}')">
    Update Points</button>
    <button class="danger"
    onclick="blockPlayer('${safeAttr(uid)}')">
    Block Player</button>
   </div>
  `;

 }catch(error){
  $("playerResult").textContent="Search failed: "+error.message;
 }
}

window.searchPlayer=async function(uid){
 $("playerUid").value=uid;
 await findPlayer();
};

window.updatePoints=async function(uid){
 const value=$("newPoints")?.value;

 if(value===""||value===undefined){
  alert("Enter valid points.");
  return;
 }

 const points=Number(value);

 if(!Number.isFinite(points)){
  alert("Enter valid points.");
  return;
 }

 try{
  await update(ref(db,"leaderboard/"+uid),{points});
  alert("Player points updated.");
 }catch(error){
  alert("Update failed: "+error.message);
 }
};

window.blockPlayer=async function(uid){
 if(!confirm("Block this player?"))return;

 try{
  await set(ref(db,"blockedUsers/"+uid),true);
  alert("Player blocked.");
 }catch(error){
  alert("Block failed: "+error.message);
 }
};

window.unblockPlayer=async function(uid){
 if(!confirm("Unblock this player?"))return;

 try{
  await remove(ref(db,"blockedUsers/"+uid));
  alert("Player unblocked.");
 }catch(error){
  alert("Unblock failed: "+error.message);
 }
};

function loadData(){
 if(dataLoaded)return;
 dataLoaded=true;

 onValue(ref(db,"leaderboard"),snap=>{
  renderLeaderboard(snap.val());
 },showError);

 onValue(ref(db,"matchmaking"),snap=>{
  renderMatchmaking(snap.val());
 },showError);

 onValue(ref(db,"blockedUsers"),snap=>{
  renderBlocked(snap.val());
 },showError);
}

$("searchBtn").addEventListener("click",findPlayer);

$("refreshBtn").addEventListener("click",async()=>{
 status("Refreshing data...");

 try{
  const [players,matches,blocked]=await Promise.all([
   get(ref(db,"leaderboard")),
   get(ref(db,"matchmaking")),
   get(ref(db,"blockedUsers"))
  ]);

  renderLeaderboard(players.val());
  renderMatchmaking(matches.val());
  renderBlocked(blocked.val());

  status("Data refreshed successfully.");

 }catch(error){
  showError(error);
 }
});

$("logoutBtn").addEventListener("click",async()=>{
 try{
  sessionStorage.removeItem("chessMasterAdminSession");
  await signOut(auth);
  location.replace("./admin-login.html");
 }catch(error){
  showError(error);
 }
});

// AUTH CHECK

onAuthStateChanged(auth,user=>{

 if(redirecting)return;

 if(!user){
  $("dashboard").classList.add("hidden");
  redirecting=true;
  status("Login required. Redirecting...");
  location.replace("./admin-login.html");
  return;
 }

 if(user.uid!==OWNER_UID){
  $("dashboard").classList.add("hidden");
  redirecting=true;
  sessionStorage.removeItem("chessMasterAdminSession");

  signOut(auth).finally(()=>{
   location.replace("./admin-login.html");
  });

  return;
 }

 if(!validAdminSession()){
  $("dashboard").classList.add("hidden");
  redirecting=true;
  status("Admin password verification required.");
  location.replace("./admin-login.html");
  return;
 }

 showDashboard(user);
 loadData();
});

</script>
</body>
</html>
