<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Master - Multiplayer</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top,#24364b,#0c111b 70%);
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:15px;
}
.container{max-width:540px;margin:auto}
h1{color:#f5c76a;margin:8px 0 15px}
.panel{
  background:#1a2432;
  border:1px solid #34465d;
  border-radius:14px;
  padding:12px;
  margin:10px 0;
}
.players{display:flex;justify-content:space-between;gap:10px}
.player{
  flex:1;
  background:#26364a;
  padding:10px;
  border-radius:10px;
}
.player.active{border:2px solid #f5c76a}
.name{font-size:14px;color:#cbd5e1}
.clock{font-size:25px;font-weight:bold;margin-top:5px}
#status{font-weight:bold;color:#f5d58b}

/* BOT STYLE CHESS BOARD */
#board{
  width:min(94vw,480px);
  aspect-ratio:1/1;
  margin:14px auto;
  display:grid;
  grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(8,1fr);
  border:5px solid #79512e;
  border-radius:5px;
  overflow:hidden;
  background:#79512e;
  box-shadow:0 8px 25px #0008;
}
.square{
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  border:0;
  padding:0;
  font-size:clamp(28px,9vw,55px);
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.light{background:#f0d9b5}
.dark{background:#b58863}

.whitePiece{
  color:#fffdf4;
  text-shadow:1px 2px 2px #222;
  font-family:"DejaVu Sans","Segoe UI Symbol",serif;
  -webkit-text-stroke:1px #282828;
}
.blackPiece{
  color:#171717;
  text-shadow:1px 1px 1px #eee;
  font-family:"DejaVu Sans","Segoe UI Symbol",serif;
}

.square.selected{
  background:#e8cf42!important;
  box-shadow:inset 0 0 0 3px #fff1a0;
}
.square.last{
  background:#baca44!important;
}
.dot{
  width:25%;
  height:25%;
  border-radius:50%;
  background:#286c3c;
  opacity:.75;
  pointer-events:none;
}
.capture{
  position:absolute;
  inset:3px;
  border:4px solid #286c3c;
  border-radius:50%;
  pointer-events:none;
}

button.action{
  border:0;
  border-radius:9px;
  padding:12px 17px;
  margin:5px;
  background:#f5c76a;
  color:#171717;
  font-weight:bold;
  cursor:pointer;
}
button.secondary{background:#34465d;color:white}
button:disabled{opacity:.45;cursor:not-allowed}
#message{min-height:22px;color:#f5d58b;font-size:14px}
#gameOver{
  display:none;
  position:fixed;
  inset:0;
  background:#000c;
  z-index:10;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.resultBox{
  width:min(90vw,380px);
  background:#1a2432;
  border:2px solid #f5c76a;
  border-radius:18px;
  padding:28px 18px;
  animation:pop .4s ease;
}
.resultIcon{font-size:55px}
.resultTitle{font-size:28px;color:#f5c76a;margin:12px}
@keyframes pop{
  from{transform:scale(.6);opacity:0}
  to{transform:scale(1);opacity:1}
}
#promotion{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  z-index:20;
  justify-content:center;
  align-items:center;
}
.promoBox{
  background:#1a2432;
  border:1px solid #f5c76a;
  padding:20px;
  border-radius:14px;
}
.promoBox button{font-size:28px;min-width:55px}
.small{font-size:12px;color:#aab7c7}
</style>
</head>

<body>
<div class="container">

<h1>♟ CHESS MASTER</h1>

<div class="panel">
  <div class="players">
    <div class="player" id="whitePlayer">
      <div class="name" id="whiteName">White Player</div>
      <div class="clock" id="whiteClock">10:00</div>
    </div>
    <div class="player" id="blackPlayer">
      <div class="name" id="blackName">Black Player</div>
      <div class="clock" id="blackClock">10:00</div>
    </div>
  </div>
</div>

<div id="status" class="panel">Connecting to match...</div>
<div id="board"></div>
<div id="message"></div>

<div class="panel">
  <div class="small" id="turnInfo">Waiting for game...</div>
  <button class="action secondary" id="dashboardBtn">Dashboard</button>
</div>

</div>

<div id="gameOver">
  <div class="resultBox">
    <div class="resultIcon" id="resultIcon">🏆</div>
    <div class="resultTitle" id="resultTitle">Game Over</div>
    <p id="resultText"></p>
    <button class="action" onclick="goDashboard()">Go to Dashboard</button>
  </div>
</div>

<div id="promotion">
  <div class="promoBox">
    <h3>Choose Promotion</h3>
    <button class="action" onclick="choosePromotion('q')">♕</button>
    <button class="action" onclick="choosePromotion('r')">♖</button>
    <button class="action" onclick="choosePromotion('b')">♗</button>
    <button class="action" onclick="choosePromotion('n')">♘</button>
    <br>
    <button class="action secondary" onclick="cancelPromotion()">Cancel</button>
  </div>
</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getDatabase,
  ref,
  onValue,
  runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import { Chess }
from "https://esm.sh/chess.js@1.4.0";

const firebaseConfig = {
  apiKey: "AIzaSyAtpvwOOn-7I6eoRR3VK2ZR_IqIy7Hcu0Y",
  authDomain: "freedroid-cloud.firebaseapp.com",
  databaseURL: "https://freedroid-cloud-default-rtdb.firebaseio.com",
  projectId: "freedroid-cloud",
  storageBucket: "freedroid-cloud.firebasestorage.app",
  messagingSenderId: "909415918359",
  appId: "1:909415918359:web:85da71cdd35a879fa86552",
  measurementId: "G-HV2ELB7GS6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const START_FEN =
"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";

const params = new URLSearchParams(location.search);
const matchId = params.get("matchId");
const myColor = params.get("color");

let user = null;
let matchRef = null;
let matchData = null;
let game = new Chess();
let selected = null;
let legalTargets = [];
let pendingMove = null;
let busy = false;
let clockInterval = null;
let lastFen = "";
let lastMove = null;

const $ = id => document.getElementById(id);

const pieces = {
  wk:"♔",wq:"♕",wr:"♖",wb:"♗",wn:"♘",wp:"♙",
  bk:"♚",bq:"♛",br:"♜",bb:"♝",bn:"♞",bp:"♟"
};

function normalizeTurn(turn){
  if(turn === "black" || turn === "b") return "black";
  return "white";
}

function colorTurn(){
  return normalizeTurn(matchData?.turn);
}

function formatTime(ms){
  ms = Math.max(0,Math.floor(ms/1000));
  const m = Math.floor(ms/60);
  const s = ms%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function playerName(color){
  return matchData?.players?.[color]?.name ||
         (color==="white"?"White Player":"Black Player");
}

function getClock(color){
  return Number(matchData?.clocks?.[color] ?? 600000);
}

function remainingTime(color){
  let time = getClock(color);
  if(colorTurn()===color && matchData?.turnStartedAt){
    time -= Date.now()-Number(matchData.turnStartedAt);
  }
  return Math.max(0,time);
}

function updateInfo(){
  $("whiteName").textContent=playerName("white");
  $("blackName").textContent=playerName("black");

  $("whiteClock").textContent=formatTime(remainingTime("white"));
  $("blackClock").textContent=formatTime(remainingTime("black"));

  $("whitePlayer").classList.toggle("active",colorTurn()==="white");
  $("blackPlayer").classList.toggle("active",colorTurn()==="black");

  const mine = colorTurn()===myColor;
  $("turnInfo").textContent =
    mine ? "Your turn ("+myColor+")" : "Opponent's turn";

  $("status").textContent =
    game.isCheck() ? "⚠ CHECK!" :
    (colorTurn()==="white"?"White to move":"Black to move");
}

/* UPDATED BOT STYLE BOARD */
function renderBoard(){
  const board=$("board");
  board.innerHTML="";

  let squares=[];

  for(let r=8;r>=1;r--){
    for(let f=0;f<8;f++){
      squares.push("abcdefgh"[f]+r);
    }
  }

  if(myColor==="black") squares.reverse();

  for(const sq of squares){

    const file=sq.charCodeAt(0)-97;
    const rank=Number(sq[1]);
    const row=8-rank;
    const col=file;
    const piece=game.get(sq);

    const button=document.createElement("button");

    button.className="square "+
      ((row+col)%2===0?"light":"dark");

    button.dataset.square=sq;

    if(sq===selected) button.classList.add("selected");

    if(lastMove &&
      (sq===lastMove.from || sq===lastMove.to)){
      button.classList.add("last");
    }

    if(piece){
      const key=(piece.color==="w"?"w":"b")+piece.type;
      const span=document.createElement("span");

      span.className=
        piece.color==="w"?"whitePiece":"blackPiece";

      span.textContent=pieces[key];
      button.appendChild(span);
    }

    if(legalTargets.includes(sq)){
      if(piece){
        const ring=document.createElement("span");
        ring.className="capture";
        button.appendChild(ring);
      }else{
        const dot=document.createElement("span");
        dot.className="dot";
        button.appendChild(dot);
      }
    }

    button.addEventListener("click",()=>squareClick(sq));
    board.appendChild(button);
  }

  updateInfo();
}

function squareClick(sq){
  if(!matchData || matchData.status==="completed" || busy) return;

  if(colorTurn()!==myColor){
    $("message").textContent="Wait for your turn.";
    return;
  }

  const piece=game.get(sq);

  if(selected && legalTargets.includes(sq)){
    const moving=game.get(selected);

    if(moving?.type==="p" && (sq[1]==="1"||sq[1]==="8")){
      pendingMove={from:selected,to:sq};
      $("promotion").style.display="flex";
      return;
    }

    makeMove(selected,sq);
    return;
  }

  if(piece && piece.color===(myColor==="white"?"w":"b")){
    selected=sq;
    legalTargets=game.moves({square:sq,verbose:true}).map(m=>m.to);
    $("message").textContent="";
  }else{
    selected=null;
    legalTargets=[];
  }

  renderBoard();
}

window.choosePromotion=function(piece){
  if(!pendingMove)return;

  const move=pendingMove;
  pendingMove=null;
  $("promotion").style.display="none";
  makeMove(move.from,move.to,piece);
};

window.cancelPromotion=function(){
  pendingMove=null;
  $("promotion").style.display="none";
};

async function makeMove(from,to,promotion="q"){
  if(busy || !matchRef || colorTurn()!==myColor)return;

  busy=true;
  $("message").textContent="Sending move...";

  try{
    const result=await runTransaction(matchRef,current=>{
      if(!current || current.status==="completed")return;

      const turn=normalizeTurn(current.turn);
      if(turn!==myColor)return;

      const fen=current.fen || current.initialFen ||
                current.initialFEN || START_FEN;

      const temp=new Chess(fen);

      const clocks={
        white:Number(current.clocks?.white ?? 600000),
        black:Number(current.clocks?.black ?? 600000)
      };

      const started=Number(current.turnStartedAt || Date.now());
      clocks[turn]-=Date.now()-started;

      if(clocks[turn]<=0){
        current.clocks=clocks;
        current.status="completed";
        current.winner=turn==="white"?"black":"white";
        current.result="Time out";
        return current;
      }

      let move;
      try{
        move=temp.move({from,to,promotion});
      }catch(e){
        return;
      }

      if(!move)return;

      const nextTurn=turn==="white"?"black":"white";
      const history=Array.isArray(current.moveHistory)
        ? current.moveHistory.slice() : [];

      history.push({
        color:turn,
        from:move.from,
        to:move.to,
        san:move.san,
        time:Date.now()
      });

      current.fen=temp.fen();
      current.turn=nextTurn;
      current.clocks=clocks;
      current.turnStartedAt=Date.now();
      current.moveHistory=history;
      current.lastMove={from:move.from,to:move.to};

      if(temp.isCheckmate()){
        current.status="completed";
        current.winner=turn;
        current.result="Checkmate";
      }else if(temp.isDraw()){
        current.status="completed";
        current.winner=null;
        current.result="Draw";
      }

      return current;
    });

    if(!result.committed){
      $("message").textContent="Move not accepted. Please refresh or wait.";
    }else{
      $("message").textContent="";
    }

  }catch(error){
    console.error(error);
    $("message").textContent="Move error: "+error.message;
  }

  selected=null;
  legalTargets=[];
  busy=false;
}

function showGameOver(data){
  if($("gameOver").style.display==="flex")return;

  const winner=data.winner;
  let title="DRAW!";
  let icon="🤝";
  let text=data.result || "The match has ended.";

  if(winner){
    const won=winner===myColor;
    title=won?"YOU WIN!":"YOU LOSE!";
    icon=won?"🏆":"😔";
    text=won?"Congratulations! You won the match.":"Your opponent won the match.";
  }

  $("resultIcon").textContent=icon;
  $("resultTitle").textContent=title;
  $("resultText").textContent=text;
  $("gameOver").style.display="flex";
}

function goDashboard(){
  location.href="./dashboard.html";
}

window.goDashboard=goDashboard;
$("dashboardBtn").addEventListener("click",goDashboard);

async function checkTimeout(){
  if(!matchRef || !matchData || matchData.status==="completed")return;

  const turn=colorTurn();
  if(remainingTime(turn)>0)return;

  try{
    await runTransaction(matchRef,current=>{
      if(!current || current.status==="completed")return;

      const active=normalizeTurn(current.turn);
      const clocks={
        white:Number(current.clocks?.white ?? 600000),
        black:Number(current.clocks?.black ?? 600000)
      };

      const elapsed=Date.now()-Number(current.turnStartedAt || Date.now());
      clocks[active]-=elapsed;

      if(clocks[active]<=0){
        current.clocks=clocks;
        current.status="completed";
        current.winner=active==="white"?"black":"white";
        current.result="Time out";
        return current;
      }

      return;
    });
  }catch(error){
    console.error(error);
  }
}

function startClock(){
  if(clockInterval)clearInterval(clockInterval);

  clockInterval=setInterval(()=>{
    if(!matchData || matchData.status==="completed")return;

    updateInfo();
    checkTimeout();
  },1000);
}

async function initializeMatch(){
  if(!matchId || !["white","black"].includes(myColor)){
    $("status").textContent="Invalid match link.";
    return;
  }

  matchRef=ref(db,"matchmaking/matches/"+matchId);

  const snap=await new Promise((resolve,reject)=>{
    onValue(matchRef,resolve,{onlyOnce:true});
  });

  const data=snap.val();

  if(!data){
    $("status").textContent="Match not found.";
    return;
  }

  const player=data.players?.[myColor];

  if(!player || player.uid!==user.uid){
    $("status").textContent="You are not a player in this match.";
    return;
  }

  await runTransaction(matchRef,current=>{
    if(!current)return;
    if(current.status==="completed")return current;

    if(!current.fen){
      current.fen=current.initialFen || current.initialFEN || START_FEN;
    }

    if(!current.turn)current.turn="white";

    if(!current.clocks){
      current.clocks={white:600000,black:600000};
    }

    if(!current.turnStartedAt){
      current.turnStartedAt=Date.now();
    }

    if(current.status==="ready")current.status="playing";

    return current;
  });

  onValue(matchRef,snapshot=>{
    const current=snapshot.val();
    if(!current)return;

    matchData=current;

    const fen=current.fen || current.initialFen ||
              current.initialFEN || START_FEN;

    if(fen!==lastFen){
      try{
        game.load(fen);
        lastFen=fen;
        lastMove=current.lastMove || null;
        selected=null;
        legalTargets=[];
      }catch(error){
        console.error("Invalid chess position",error);
        $("status").textContent="Invalid chess position.";
        return;
      }
    }

    renderBoard();

    if(current.status==="completed"){
      clearInterval(clockInterval);
      showGameOver(current);
    }else{
      $("gameOver").style.display="none";
    }
  });

  startClock();
}

onAuthStateChanged(auth,async currentUser=>{
  if(!currentUser){
    location.replace("./login.html");
    return;
  }

  user=currentUser;

  try{
    await initializeMatch();
  }catch(error){
    console.error(error);
    $("status").textContent="Could not load match: "+error.message;
  }
});
</script>
</body>
  </html>
