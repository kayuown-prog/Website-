
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Master - Live Game</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
 min-height:100vh;
 background:radial-gradient(ellipse at center,#07565a,#00272d 80%);
 color:white;
 font-family:Arial,sans-serif;
 text-align:center;
 padding-bottom:20px;
}

.top-header{
 min-height:100px;
 padding:15px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:repeating-linear-gradient(175deg,transparent,#ffffff08 8px,transparent 18px),linear-gradient(145deg,#4b1d08,#8b3d12,#4a1d08);
 border-bottom:5px solid #e5a72e;
 box-shadow:0 5px 15px #0008;
}

.brand{display:flex;align-items:center;gap:10px}

.logo{
 width:60px;height:60px;border-radius:50%;
 border:4px solid #f5c44a;
 background:radial-gradient(circle,#24445c,#081323);
 display:flex;align-items:center;justify-content:center;
 color:#f5c76a;font-size:35px;
}

.brand-name{color:#ffd16a;font-size:clamp(20px,5vw,28px);font-weight:900}
.brand-subtitle{font-size:10px;color:#7ce8e9;letter-spacing:3px;margin-top:5px;font-weight:bold}

.top-btn{
 width:50px;height:50px;border:0;border-radius:8px;
 background:linear-gradient(#e62817,#a90000);
 color:#ffdb56;font-size:25px;
}

#players{
 display:flex;gap:8px;max-width:480px;
 margin:15px auto;padding:0 8px;
}

.player{
 flex:1;background:linear-gradient(110deg,#003137,#00464a);
 padding:12px 5px;border-radius:9px;
 font-size:13px;border:2px solid #75502b;
 overflow-wrap:anywhere;
}

.player.active{
 border:2px solid #f5c44a;
 box-shadow:0 0 10px #f5c44a66;
}

.player-name{font-weight:bold;margin-bottom:9px}
.lives{font-size:19px;letter-spacing:2px;margin:6px 0}

.player-timer{
 display:none;
 background:#151c25;
 color:#ffcf53;
 border:1px solid #e5b653;
 border-radius:7px;
 padding:8px;
 margin-top:8px;
 font-size:21px;
 font-weight:bold;
 font-variant-numeric:tabular-nums;
}

.player-timer.urgent{
 color:#ff4545;
 border-color:#ff4545;
 animation:blink .5s infinite alternate;
}

@keyframes blink{to{opacity:.45}}

#status{
 max-width:480px;margin:12px auto;
 background:linear-gradient(110deg,#003137,#00464a);
 padding:14px;border-radius:9px;
 color:#ffcf53;font-weight:bold;
 border-bottom:3px solid #9d5723;
}

.board-wrapper{
 width:100%;padding:0 5px;
 background:linear-gradient(#72340f,#301507);
 border-top:5px solid #a95b23;
 border-bottom:5px solid #a95b23;
 box-shadow:0 5px 12px #0009;
}

#board{
 width:100%;max-width:650px;aspect-ratio:1;
 display:grid;grid-template-columns:repeat(8,minmax(0,1fr));
 border:4px solid #8b4b1d;
 overflow:hidden;margin:auto;
}

.square{
 aspect-ratio:1;position:relative;
 display:flex;align-items:center;justify-content:center;
 cursor:pointer;user-select:none;overflow:hidden;
 -webkit-tap-highlight-color:transparent;
}

.light{background:linear-gradient(140deg,#fff5e3,#e8d5b8)}
.dark{
 background:repeating-linear-gradient(160deg,transparent,#ffffff05 4px,transparent 9px),linear-gradient(140deg,#171717,#080808);
}

.piece{
 font-family:"DejaVu Sans","Segoe UI Symbol",serif;
 font-size:clamp(34px,9.5vw,66px);
 line-height:1;z-index:2;display:block;
 transform:scale(1.08);pointer-events:none;
}

.white-piece{
 color:#fffdf5;-webkit-text-stroke:1px #777;
 text-shadow:0 2px 1px #777,0 4px 2px #555,0 6px 3px #333,0 0 7px #fff9;
}

.black-piece{
 color:#151a28;-webkit-text-stroke:1px #718096;
 text-shadow:0 2px 1px #000,0 4px 2px #000,0 6px 3px #000,0 0 6px #aab8d880;
}

.selected{background:#c9d64c!important;box-shadow:inset 0 0 0 4px #fff1a0}
.last-move{background:#b6c957!important}

.dot{
 width:25%;height:25%;border-radius:50%;
 background:#138d51;position:absolute;z-index:3;
 opacity:.8;pointer-events:none;
}

.capture{
 position:absolute;inset:3px;border:4px solid #138d51;
 border-radius:50%;z-index:3;pointer-events:none;
}

.coordinates{position:absolute;z-index:4;font-size:10px;font-weight:bold;pointer-events:none}
.rank{top:2px;left:3px}
.file{bottom:2px;right:4px}
.light .coordinates{color:#292929}
.dark .coordinates{color:#fff}

#info{
 color:#fff2c9;padding:12px;min-height:45px;
 font-size:14px;font-weight:bold;
 background:#00343a;margin-top:12px;
}

.controls{
 display:flex;justify-content:center;
 flex-wrap:wrap;gap:10px;padding:15px 8px;
}

button{
 padding:13px 20px;
 background:linear-gradient(#e8b84f,#b77b24);
 border:2px solid #f5cf72;border-radius:9px;
 color:#241506;font-weight:bold;cursor:pointer;
}

button:active{transform:scale(.96)}

#gameOver{
 display:none;
 max-width:430px;margin:15px auto;
 background:#192532;border:2px solid #f5c44a;
 border-radius:12px;padding:20px;
 color:#ffcf53;
}

@media(min-width:600px){
 .board-wrapper{max-width:660px;margin:auto;padding:5px}
}

@media(max-width:360px){
 .coordinates{font-size:8px}
 .piece{font-size:clamp(30px,9vw,45px)}
 .player{font-size:11px}
 .lives{font-size:16px}
}
</style>
</head>

<body>

<div class="top-header">
 <div class="brand">
  <div class="logo">♟</div>
  <div>
   <div class="brand-name">CHESS MASTER</div>
   <div class="brand-subtitle">PLAY • THINK • WIN</div>
  </div>
 </div>

 <button class="top-btn"
 onclick="location.href='dashboard.html'">⚙</button>
</div>

<div id="loading">Connecting to match...</div>

<div id="gameArea" style="display:none">

 <div id="players">

  <div class="player" id="blackPlayer">
   <div class="player-name">♚ Black</div>
   <div class="lives" id="blackLives">❤️❤️❤️</div>
   <div class="player-timer" id="blackTimer">00:30</div>
  </div>

 </div>

 <div id="status">Loading game...</div>

 <div class="board-wrapper">

 <p id="info">Select your piece and destination.</p>

 </div>

 <div class="controls">
  <button id="exitBtn">EXIT GAME</button>
  <button onclick="location.href='dashboard.html'">DASHBOARD</button>
 </div>

</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {getAuth,onAuthStateChanged}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getDatabase,ref,get,update,onValue,runTransaction,off
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {Chess}
from "https://esm.sh/chess.js@1.4.0";


/* FIREBASE CONFIG */

const firebaseConfig={
 apiKey:"AIzaSyAtpvwOOn-7I6eoRR3VK2ZR_IqIy7Hcu0Y",
 authDomain:"freedroid-cloud.firebaseapp.com",
 databaseURL:"https://freedroid-cloud-default-rtdb.firebaseio.com",
 projectId:"freedroid-cloud",
 storageBucket:"freedroid-cloud.firebasestorage.app",
 messagingSenderId:"909415918359",
 appId:"1:909415918359:web:85da71cdd35a879fa86552",
 measurementId:"G-HV2ELB7GS6"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);


/* MATCH DATA */

const params=new URLSearchParams(location.search);
const matchId=params.get("matchId");
const player=params.get("color");

const loading=document.getElementById("loading");
const area=document.getElementById("gameArea");
const boardEl=document.getElementById("board");
const statusEl=document.getElementById("status");

const gameRef=matchId?
 ref(db,"matchmaking/matches/"+matchId):null;

let user=null;
let game=new Chess();
let selected=null;
let possibleMoves=[];
let busy=false;
let matchData=null;
let unsubscribe=null;
let started=false;
let lastMove=null;

let serverOffset=0;
let timeoutBusy=false;
let clockInitBusy=false;
let timerInterval=null;


/* PIECES */

const pieces={
 w:{k:"♔",q:"♕",r:"♖",b:"♗",n:"♘",p:"♙"},
 b:{k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"}
};


/* TIME */

function serverNow(){
 return Date.now()+serverOffset;
}

function formatTime(ms){
 const seconds=Math.max(0,Math.ceil(ms/1000));
 const m=String(Math.floor(seconds/60)).padStart(2,"0");
 const s=String(seconds%60).padStart(2,"0");
 return m+":"+s;
}


/* HELPERS */

function showError(t){
 loading.textContent=t;
 loading.style.display="block";
 area.style.display="none";
}

function setStatus(t){
 statusEl.textContent=t;
}

function clearSelection(){
 selected=null;
 possibleMoves=[];
}


/* INITIALIZE TIMER AND LIVES */

async function initializeClock(){

 if(clockInitBusy||!gameRef)return;

 clockInitBusy=true;

 const now=serverNow();

 try{

  await runTransaction(gameRef,data=>{

   if(!data||data.status!=="ready")return;

   if(!data.lives){
    data.lives={
     white:3,
     black:3
    };
   }

   if(typeof data.lives.white!=="number")data.lives.white=3;
   if(typeof data.lives.black!=="number")data.lives.black=3;

   if(typeof data.turnDeadline!=="number"){

    const turn=data.turn||
     (data.fen?.split(" ")[1]==="b"?"black":"white");

    data.turn=turn;
    data.turnStartedAt=now;
    data.turnDeadline=now+30000;
   }

   return data;

  },{applyLocally:false});

 }catch(e){
  console.error("Clock initialization:",e);
 }finally{
  clockInitBusy=false;
 }
}


/* START GAME */

async function startGame(){

 try{

  if(!matchId||!["white","black"].includes(player)){
   showError("Invalid match link.");
   return;
  }

  const snap=await get(gameRef);

  if(!snap.exists()){
   showError("Match not found: "+matchId);
   return;
  }

  const data=snap.val();

  if(data.status!=="ready"){
   showError("Match is not ready.");
   return;
  }

  if(data.players?.[player]?.uid!==user.uid){
   showError("Your account is not assigned to this match.");
   return;
  }

  if(!data.fen){
   await update(gameRef,{
    fen:new Chess().fen(),
    turn:"white"
   });
  }

  area.style.display="block";
  loading.style.display="none";

  await initializeClock();

  listenMatch();

  if(!timerInterval){
   timerInterval=setInterval(timerTick,200);
  }

 }catch(e){
  showError("Firebase error: "+e.message);
 }
}


/* LIVE MATCH LISTENER */

function listenMatch(){

 if(started)return;
 started=true;

 unsubscribe=onValue(gameRef,snap=>{

  if(!snap.exists()){
   setStatus("Match no longer exists.");
   return;
  }

  matchData=snap.val();

  if(matchData.players?.[player]?.uid!==user.uid){
   setStatus("Player verification failed.");
   return;
  }

  try{
   game=new Chess(matchData.fen||new Chess().fen());
  }catch(e){
   setStatus("Invalid chess position.");
   return;
  }

  lastMove=matchData.lastMove||null;

  updatePlayerCards();

  render();

  updateStatus();

  updateTimerUI();

  if(matchData.status==="ready"&&
     typeof matchData.turnDeadline!=="number"){
   initializeClock();
  }

 },error=>{
  setStatus("Database error: "+error.message);
 });
}


/* PLAYER CARDS */

function updatePlayerCards(){

 if(!matchData)return;

 const white=document.getElementById("whitePlayer");
 const black=document.getElementById("blackPlayer");

 white.querySelector(".player-name").textContent=
  "♔ White: "+(matchData.players.white.name||"White");

 black.querySelector(".player-name").textContent=
  "♚ Black: "+(matchData.players.black.name||"Black");

 const lives=matchData.lives||{white:3,black:3};

 document.getElementById("whiteLives").textContent=
  "❤️".repeat(Math.max(0,lives.white))+
  "🖤".repeat(Math.max(0,3-lives.white));

 document.getElementById("blackLives").textContent=
  "❤️".repeat(Math.max(0,lives.black))+
  "🖤".repeat(Math.max(0,3-lives.black));

 white.classList.toggle("active",game.turn()==="w"&&matchData.status==="ready");
 black.classList.toggle("active",game.turn()==="b"&&matchData.status==="ready");
}


/* TIMER DISPLAY */

function updateTimerUI(){

 if(!matchData)return;

 const whiteTimer=document.getElementById("whiteTimer");
 const blackTimer=document.getElementById("blackTimer");

 whiteTimer.style.display="none";
 blackTimer.style.display="none";

 whiteTimer.classList.remove("urgent");
 blackTimer.classList.remove("urgent");

 if(matchData.status!=="ready")return;

 const currentTurn=game.turn()==="w"?"white":"black";

 // Timer only on the screen of the player whose turn it is.
 if(currentTurn!==player)return;

 const timer=player==="white"?whiteTimer:blackTimer;

 const deadline=matchData.turnDeadline;

 if(typeof deadline!=="number")return;

 const remaining=deadline-serverNow();

 timer.textContent=formatTime(remaining);
 timer.style.display="block";

 if(remaining<=10000){
  timer.classList.add("urgent");
 }
}


/* TIMER ENGINE */

function timerTick(){

 if(!matchData||matchData.status!=="ready")return;

 updateTimerUI();

 const deadline=matchData.turnDeadline;

 if(typeof deadline!=="number")return;

 if(serverNow()>=deadline){
  resolveTimeout();
 }
}


/* TIMEOUT: REMOVE ONLY CURRENT PLAYER'S LIFE */

async function resolveTimeout(){

 if(timeoutBusy||!gameRef)return;

 timeoutBusy=true;

 const now=serverNow();

 try{

  await runTransaction(gameRef,data=>{

   if(!data||data.status!=="ready")return;

   if(typeof data.turnDeadline!=="number")return;

   // Another player may already have made a move.
   if(now<data.turnDeadline)return;

   const latest=new Chess(data.fen||new Chess().fen());

   const timedOutPlayer=
    latest.turn()==="w"?"white":"black";

   const otherPlayer=
    timedOutPlayer==="white"?"black":"white";

   data.lives=data.lives||{
    white:3,
    black:3
   };

   if(typeof data.lives[timedOutPlayer]!=="number"){
    data.lives[timedOutPlayer]=3;
   }

   // Only the player whose turn expired loses a life.
   data.lives[timedOutPlayer]=Math.max(
    0,data.lives[timedOutPlayer]-1
   );

   data.lastTimeout={
    player:timedOutPlayer,
    at:now,
    livesRemaining:data.lives[timedOutPlayer]
   };

   // Third life lost: game over.
   if(data.lives[timedOutPlayer]<=0){

    data.status="finished";
    data.winner=otherPlayer;
    data.result="timeout_lives";
    data.finishedAt=now;
    data.turnDeadline=null;

    return data;
   }

   // Generate a random legal move for the timed-out player.
   const legalMoves=latest.moves({verbose:true});

   if(legalMoves.length===0){

    data.status="finished";
    data.winner=latest.isCheckmate()?otherPlayer:null;
    data.result=latest.isCheckmate()?"checkmate":"draw";
    data.finishedAt=now;
    data.turnDeadline=null;

    return data;
   }

   const randomMove=
    legalMoves[Math.floor(Math.random()*legalMoves.length)];

   latest.move({
    from:randomMove.from,
    to:randomMove.to,
    promotion:randomMove.promotion||"q"
   });

   data.fen=latest.fen();

   data.turn=latest.turn()==="w"?"white":"black";

   data.lastMove={
    from:randomMove.from,
    to:randomMove.to,
    by:"timeout",
    timedOutPlayer:timedOutPlayer,
    at:now
   };

   // Check whether the automatic move ended the chess game.
   if(latest.isCheckmate()){

    data.status="finished";
    data.winner=latest.turn()==="w"?"black":"white";
    data.result="checkmate";
    data.finishedAt=now;
    data.turnDeadline=null;

   }else if(latest.isDraw()){

    data.status="finished";
    data.winner=null;
    data.result="draw";
    data.finishedAt=now;
    data.turnDeadline=null;

   }else{

    // Start the next player's 30-second turn.
    data.turnStartedAt=now;
    data.turnDeadline=now+30000;
   }

   return data;

  },{applyLocally:false});

 }catch(e){
  console.error("Timeout error:",e);
 }finally{
  timeoutBusy=false;
 }
}


/* GAME STATUS */

function updateStatus(){

 if(!matchData)return;

 if(matchData.status==="finished"){

  const winner=matchData.winner;

  if(matchData.result==="timeout_lives"){

   setStatus("GAME OVER! "+winner.toUpperCase()+" WINS!");

   document.getElementById("gameOverTitle").textContent="🏆 GAME OVER";

   document.getElementById("gameOverMessage").textContent=
    winner.toUpperCase()+" WINS! Opponent lost all 3 lives.";

  }else if(matchData.result==="checkmate"){

   setStatus("CHECKMATE! "+winner.toUpperCase()+" WINS!");

   document.getElementById("gameOverTitle").textContent="🏆 CHECKMATE";

   document.getElementById("gameOverMessage").textContent=
    winner.toUpperCase()+" WINS!";

  }else{

   setStatus("GAME DRAW!");

   document.getElementById("gameOverTitle").textContent="GAME DRAW";

   document.getElementById("gameOverMessage").textContent=
    "The match ended in a draw.";
  }

  document.getElementById("gameOver").style.display="block";

  return;
 }

 if(matchData.status!=="ready"){
  setStatus("Match is not active.");
  return;
 }

 if(game.isCheckmate()){
  setStatus("CHECKMATE!");
  return;
 }

 if(game.isDraw()){
  setStatus("GAME DRAW!");
  return;
 }

 const current=game.turn()==="w"?"White":"Black";

 const myTurn=game.turn()===(player==="white"?"w":"b");

 if(game.isCheck()){
  setStatus(current+" IS IN CHECK!"+(myTurn?" YOUR TURN":""));
  return;
 }

 setStatus(
  current+" TO MOVE"+(myTurn?" — YOUR TURN":" — OPPONENT'S TURN")
 );
}


/* CHESSBOARD RENDER */

function render(){

 boardEl.innerHTML="";

 const position=game.board();

 const rows=player==="white"?
  [0,1,2,3,4,5,6,7]:
  [7,6,5,4,3,2,1,0];

 const cols=player==="white"?
  [0,1,2,3,4,5,6,7]:
  [7,6,5,4,3,2,1,0];

 for(let vr=0;vr<8;vr++){

  for(let vc=0;vc<8;vc++){

   const r=rows[vr];
   const c=cols[vc];

   const cell=position[r][c];

   const name=String.fromCharCode(97+c)+(8-r);

   const square=document.createElement("div");

   square.className="square "+((vr+vc)%2?"dark":"light");

   if(selected===name){
    square.classList.add("selected");
   }

   if(lastMove&&
      (lastMove.from===name||lastMove.to===name)){
    square.classList.add("last-move");
   }

   if(cell){

    const span=document.createElement("span");

    span.className="piece "+
     (cell.color==="w"?"white-piece":"black-piece");

    span.textContent=pieces[cell.color][cell.type];

    square.appendChild(span);
   }

   if(possibleMoves.some(m=>m.to===name)){

    const marker=document.createElement("div");

    marker.className=cell?"capture":"dot";

    square.appendChild(marker);
   }

   if(vc===0){

    const rank=document.createElement("span");

    rank.className="coordinates rank";
    rank.textContent=8-r;

    square.appendChild(rank);
   }

   if(vr===7){

    const file=document.createElement("span");

    file.className="coordinates file";
    file.textContent=String.fromCharCode(97+c);

    square.appendChild(file);
   }

   square.addEventListener("click",()=>clickSquare(name));

   boardEl.appendChild(square);
  }
 }
}


/* CLICK SQUARE */

async function clickSquare(square){

 if(busy||!matchData||matchData.status!=="ready"||game.isGameOver())return;

 const turnColor=player==="white"?"w":"b";

 if(game.turn()!==turnColor)return;

 // Do not allow a move after the deadline.
 if(typeof matchData.turnDeadline==="number"&&
    serverNow()>=matchData.turnDeadline){

  resolveTimeout();
  return;
 }

 const piece=game.get(square);

 if(!selected){

  if(piece&&piece.color===turnColor){

   selected=square;

   possibleMoves=game.moves({
    square:selected,
    verbose:true
   });

   render();
  }

  return;
 }

 if(selected===square){

  clearSelection();
  render();
  return;
 }

 if(piece&&piece.color===turnColor){

  selected=square;

  possibleMoves=game.moves({
   square:selected,
   verbose:true
  });

  render();
  return;
 }

 const from=selected;

 const choices=possibleMoves.filter(m=>m.to===square);

 if(!choices.length){

  clearSelection();
  render();
  return;
 }

 let promotion="q";

 if(choices.some(m=>m.promotion)){

  const answer=prompt(
   "Promote to: q (Queen), r (Rook), b (Bishop), n (Knight)",
   "q"
  );

  if(answer===null){
   clearSelection();
   render();
   return;
  }

  promotion=["q","r","b","n"].includes(answer.toLowerCase())?
   answer.toLowerCase():"q";
 }

 clearSelection();
 busy=true;
 render();

 const now=serverNow();

 try
