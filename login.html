
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Master - Login</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #10141c;
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.login-box {
  background: #1b2433;
  padding: 35px 25px;
  border-radius: 15px;
  width: 100%;
  max-width: 380px;
  text-align: center;
  border: 1px solid #d6a84b;
}

h1 {
  color: #f5c76a;
  margin-bottom: 12px;
}

p {
  color: #ccc;
  margin-bottom: 25px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #d6a84b;
  color: #10141c;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

#message {
  margin-top: 18px;
  font-size: 14px;
  word-break: break-word;
}
</style>
</head>

<body>

<div class="login-box">
  <h1>♟ CHESS MASTER</h1>
  <p>Login to continue playing</p>

  <button id="googleBtn">Continue with Google</button>

  <div id="message"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyAtpvwOOn-7I6eoRR3VK2ZR_IqIy7Hcu0Y",
  authDomain: "freedroid-cloud.firebaseapp.com",
  databaseURL: "https://freedroid-cloud-default-rtdb.firebaseio.com",
  projectId: "freedroid-cloud",
  storageBucket: "freedroid-cloud.firebasestorage.app",
  messagingSenderId: "909415918359",
  appId: "1:909415918359:web:85da71cdd35a879fa86552",
  measurementId: "G-HV2ELB7GS6"
};
  

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const provider = new GoogleAuthProvider();
const button = document.getElementById("googleBtn");
const message = document.getElementById("message");

onAuthStateChanged(auth, (user) => {
  if (user) {
    window.location.replace("dashboard.html");
  }
});

button.addEventListener("click", async () => {
  button.disabled = true;
  message.textContent = "Please wait...";

  try {
    await signInWithPopup(auth, provider);
    window.location.replace("dashboard.html");
  } catch (error) {
    message.textContent = error.message;
    button.disabled = false;
  }
});

</script>
</body>
</html>
