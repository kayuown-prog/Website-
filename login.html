
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeDroid Login</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d18;color:white;
 font-family:Arial,sans-serif;
 display:flex;align-items:center;
 justify-content:center;min-height:100vh;
}
.card{
 width:90%;max-width:380px;
 background:#111c30;padding:28px;
 border-radius:18px;border:1px solid #263b59;
}
h1{text-align:center;color:#55d6ff}
input{
 width:100%;padding:14px;margin:10px 0;
 border:1px solid #33445e;border-radius:9px;
 background:#080d18;color:white;
}
button{
 width:100%;padding:14px;margin-top:12px;
 background:#28d995;border:0;
 border-radius:9px;font-weight:bold;
}
p{text-align:center;color:#9aabc5;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h1>FreeDroid ☁️</h1>
<h2>Welcome Back</h2>
<form onsubmit="event.preventDefault();alert('Login system will be connected with Firebase in the next step.');">
<input type="email" placeholder="Email Address" required>
<input type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<p>Authentication is not connected yet.</p>
<a href="index.html" style="color:#55d6ff">Back to Home</a>
</div>
 
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAtpvwOOn-7I6eoRR3VK2ZR_IqIy7Hcu0Y",
    authDomain: "freedroid-cloud.firebaseapp.com",
    projectId: "freedroid-cloud",
    storageBucket: "freedroid-cloud.firebasestorage.app",
    messagingSenderId: "909415918359",
    appId: "1:909415918359:web:85da71cdd35a879fa86552",
    measurementId: "G-HV2ELB7GS6"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.firebaseAuth = {
    auth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged
  };
</script>
 
</body>
</html>
