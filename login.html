
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Master - Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #101820;
  font-family: Arial, sans-serif;
  color: white;
}

.container {
  width: 90%;
  max-width: 390px;
  padding: 30px;
  background: #1c2833;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 10px 35px #0008;
}

.logo {
  font-size: 65px;
}

h1 {
  color: #f5c542;
  margin: 10px 0;
}

.subtitle {
  color: #aaa;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border: 1px solid #465563;
  border-radius: 8px;
  background: #101820;
  color: white;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 8px;
  background: #f5c542;
  color: #111;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #ffda65;
}

.secondary {
  background: #34495e;
  color: white;
}

.links {
  margin-top: 18px;
  color: #f5c542;
  cursor: pointer;
  font-size: 14px;
}

#message {
  margin-top: 15px;
  font-size: 14px;
  color: #ff7675;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">♟️</div>

  <h1>CHESS MASTER</h1>
  <p class="subtitle">Play Chess. Challenge Everyone.</p>

  <h2 id="formTitle">Login</h2>

  <input
    type="email"
    id="email"
    placeholder="Enter Email"
    autocomplete="email"
  >

  <input
    type="password"
    id="password"
    placeholder="Enter Password"
    autocomplete="current-password"
  >

  <button id="mainBtn" onclick="login()">LOGIN</button>

  <button class="secondary" id="switchBtn"
    onclick="toggleForm()">CREATE ACCOUNT</button>

  <div class="links" onclick="forgotPassword()">
    Forgot Password?
  </div>

  <p id="message"></p>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAtpvwOOn-7I6eoRR3VK2ZR_IqIy7Hcu0Y",
  authDomain: "freedroid-cloud.firebaseapp.com",
  projectId: "freedroid-cloud",
  storageBucket: "freedroid-cloud.firebasestorage.app",
  messagingSenderId: "909415918359",
  appId: "1:909415918359:web:85da71cdd35a879fa86552",
  measurementId: "G-HV2ELB7GS6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let isSignup = false;

const email = document.getElementById("email");
const password = document.getElementById("password");
const message = document.getElementById("message");

function showMessage(text, success = false) {
  message.style.color = success ? "#58d68d" : "#ff7675";
  message.textContent = text;
}

onAuthStateChanged(auth, user => {
  if (user) {
    window.location.href = "dashboard.html";
  }
});

window.toggleForm = function() {
  isSignup = !isSignup;

  document.getElementById("formTitle").textContent =
    isSignup ? "Create Account" : "Login";

  document.getElementById("mainBtn").textContent =
    isSignup ? "SIGN UP" : "LOGIN";

  document.getElementById("switchBtn").textContent =
    isSignup ? "BACK TO LOGIN" : "CREATE ACCOUNT";

  password.autocomplete = isSignup ? "new-password" : "current-password";

  showMessage("");
};

window.login = async function() {
  const e = email.value.trim();
  const p = password.value;

  if (!e || !p) {
    showMessage("Please enter email and password.");
    return;
  }

  const btn = document.getElementById("mainBtn");
  btn.disabled = true;
  btn.textContent = "PLEASE WAIT...";

  try {
    if (isSignup) {
      await createUserWithEmailAndPassword(auth, e, p);
      showMessage("Account created successfully!", true);
    } else {
      await signInWithEmailAndPassword(auth, e, p);
      showMessage("Login successful!", true);
    }
  } catch (error) {
    showMessage(error.message);
    btn.disabled = false;
    btn.textContent = isSignup ? "SIGN UP" : "LOGIN";
  }
};

window.forgotPassword = async function() {
  const e = email.value.trim();

  if (!e) {
    showMessage("Enter your email first.");
    return;
  }

  try {
    await sendPasswordResetEmail(auth, e);
    showMessage("Password reset email sent!", true);
  } catch (error) {
    showMessage(error.message);
  }
};

</script>
</body>
</html>
